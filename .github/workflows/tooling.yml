name: Tooling

on:
  push:
    branches: [main, master]
    paths:
      - "Tool/**"
      - ".github/workflows/tooling.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Tool/**"
      - ".github/workflows/tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: Tool/package-lock.json

      - name: Install locked dependencies
        working-directory: Tool
        run: npm ci

      - name: Check syntax and run loopback tests
        working-directory: Tool
        run: npm run check

  go:
    name: Go 1.22
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: Tool/Go/go.mod

      - name: Run tests repeatedly
        working-directory: Tool/Go
        run: go test -count=10 ./...

      - name: Vet
        working-directory: Tool/Go
        run: go vet ./...

      - name: Build without CGO
        working-directory: Tool/Go
        env:
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -trimpath -o bin/ci/ASAFirmwareTransfer .

  dotnet:
    name: .NET 8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Tool/C#/Uploader/Uploader.csproj

      - name: Build Release
        run: >-
          dotnet build Tool/C#/Uploader/Uploader.csproj
          -c Release
          --no-restore

      - name: Run mock-device self-tests
        run: >-
          dotnet run
          --project Tool/C#/Uploader/Uploader.csproj
          -c Release
          --no-build
          --
          --self-test

  cpp:
    name: Native C++ (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python for loopback integration tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure
        run: >-
          cmake
          -S Tool/C++
          -B Tool/C++/build/ci
          -A x64
          -DBUILD_TESTING=ON

      - name: Build Release
        run: >-
          cmake
          --build Tool/C++/build/ci
          --config Release
          --parallel

      - name: Run self-tests and loopback integration tests
        run: >-
          ctest
          --test-dir Tool/C++/build/ci
          -C Release
          --output-on-failure

  cpp-mingw:
    name: C++ cross-build (Linux to Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install MinGW-w64 compilers
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends
          ninja-build
          g++-mingw-w64-x86-64
          g++-mingw-w64-i686

      - name: Cross-build x64 and x86
        working-directory: Tool/C++
        run: |
          chmod +x build.sh
          ./build.sh --architecture all --clean
